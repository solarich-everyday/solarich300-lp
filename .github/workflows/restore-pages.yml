name: Restore Pages to main (solarich 300 LP)
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Reset Pages source to main /(root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "current pages config:"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages || true
          echo ""
          echo "resetting to legacy/main/root:"
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' -w "\nHTTP %{http_code}\n"
          echo "trigger legacy build:"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds -w "\nHTTP %{http_code}\n"
